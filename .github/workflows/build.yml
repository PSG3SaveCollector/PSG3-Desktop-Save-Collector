name: Build PSG3 Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test collector
        run: go test -v ./desktop
      - name: Build Windows EXE
        env:
          PSG3_UPLOAD_URL: https://psg3-save-intake.onrender.com/submit
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H=windowsgui -s -w -X main.receiverURL=${PSG3_UPLOAD_URL}" -o PSG3_Desktop_Save_Collector_v1_3_5_Windows_x64.exe ./desktop
          sha256sum PSG3_Desktop_Save_Collector_v1_3_5_Windows_x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PSG3-Desktop-Windows
          path: PSG3_Desktop_Save_Collector_v1_3_5_Windows_x64.exe
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create desktop-v1.3.5 PSG3_Desktop_Save_Collector_v1_3_5_Windows_x64.exe --title "PSG3 Desktop Save Collector v1.3.5" --notes "Windows collector with required email, verified local backups, and HTTPS submissions." --latest || gh release upload desktop-v1.3.5 PSG3_Desktop_Save_Collector_v1_3_5_Windows_x64.exe --clobber
